[versions]
krema = "0.3.2"
junit = "5.11.4"
spotless = "8.10.3"

[libraries]
krema-core = { module = "build.krema:krema-core", version.ref = "krema" }
krema-processor = { module = "build.krema:krema-processor", version.ref = "krema" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version = "1.0.0" }
