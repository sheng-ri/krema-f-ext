# 门禁：编译过、格式干净、单测绿；再加一条真跑 demo 的 e2e 验收（允许联网）。
# 端到端只验「产物结构 + 启动器能跑」，不真开窗口 —— 开窗口是 Krema 运行时的事，不是本插件。
.verify: &verify
  name: 构建与格式检查 + e2e
  script:
    - ./gradlew spotlessCheck test --configuration-cache
    - bash scripts/e2e.sh

# 构建环境：本仓 Dockerfile 动态构建，平台按 hash 缓存。
# Gradle 缓存挂到构建节点，跨流水线复用依赖与 wrapper。
.pipeline: &pipeline
  docker:
    build:
      dockerfile: .cnb/build/Dockerfile
      by:
        - .cnb/build/Dockerfile
    volumes:
      - gradle-cache:/home/gradle/gradle-cache:cow
  env:
    GRADLE_USER_HOME: /home/gradle/gradle-cache

# 发布：门禁过了才发，发的是代码里的 project.version。
.publish: &publish
  name: 发布到 maven registry
  script:
    - ./gradlew publish --configuration-cache

# 分支键写 "$" 兜底，任何分支的 push / PR 都过门禁。
$:
  push:
    verify:
      name: 主干门禁
      <<: *pipeline
      stages:
        - *verify

  vscode:
    - docker:
        image: docker.cnb.cool/birthcat/dev-kotlin-jvm-25:latest
      services:
        - vscode
        - docker
      runner:
        cpus: 6
      # 每次打开开发环境自动执行，安装 skills。
      env:
        CNB_WELCOME_CMD: bash /workspace/scripts/install-skills.sh

  pull_request:
    verify:
      name: PR 门禁
      <<: *pipeline
      stages:
        - *verify

  # 正式发布。
  web_trigger_release:
    - name: 发布 Release
      <<: *pipeline
      stages:
        - *verify
        - *publish

  # SNAPSHOT 发布：同版本号直接覆盖，覆盖策略由制品库负责。
  web_trigger_snapshot:
    - name: 发布 Snapshot
      <<: *pipeline
      stages:
        - *verify
        - *publish

  # 手动入口：工具链自检。
  web_trigger:
    - name: 工具链自检
      <<: *pipeline
      stages:
        - name: 打印版本
          script:
            - java -version
            - ./gradlew --version
