# 构建镜像：JDK 25 + Gradle 9.8 + 无头 GUI 依赖。
# 只有 Dockerfile 进版本键：改 apt 清单只重建，不换标签。
.docker-build:
  build:
    dockerfile: .cnb/build/Dockerfile
    by:
      - .cnb/build/Dockerfile
      - .cnb/build/apt-packages.txt
      - gradle/wrapper/gradle-wrapper.properties
    versionBy:
      - .cnb/build/Dockerfile

# 门禁只有一件事：编译过、格式干净、测试绿。
# 端到端（真开窗口）不进这里 —— 测的是 Krema 运行时，不是本插件。
.verify:
  name: 构建与格式检查
  script:
    - ./gradlew build spotlessCheck --configuration-cache

main:
  pull_request:
    verify:
      name: PR 门禁
      docker: !reference [.docker-build]
      env:
        GRADLE_USER_HOME: /home/gradle/gradle-cache
      stages:
        - !reference [.verify]

  push:
    verify:
      name: 主干门禁
      docker: !reference [.docker-build]
      env:
        GRADLE_USER_HOME: /home/gradle/gradle-cache
      stages:
        - !reference [.verify]

$:
  # 手动入口：留一个占位，端到端窗口测试将来挂这里。
  web_trigger:
    - name: 工具链自检
      docker: !reference [.docker-build]
      stages:
        - name: 打印版本
          script:
            - java -version
            - ./gradlew --version
