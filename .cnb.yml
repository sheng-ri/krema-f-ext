# 门禁只有一件事：编译过、格式干净、测试绿。
# 端到端（真开窗口）不进这里 —— 测的是 Krema 运行时，不是本插件。
.verify: &verify
  name: 构建与格式检查
  script:
    - ./gradlew spotlessCheck test --configuration-cache

# Linux 真产物验收：造一个最小 consumer 工程，真跑 kremaBundle 打出 .deb 再验包。
# 单测只能断言命令形状，「真能打出包」只有这支脚本能证明。
.deb: &deb
  name: Linux .deb 真打包验收
  script:
    - .cnb/scripts/deb-smoke.sh

# 构建环境：本仓 Dockerfile 动态构建，平台按 hash 缓存。
# Gradle 缓存挂到构建节点，跨流水线复用依赖与 wrapper。
.pipeline: &pipeline
  docker:
    build:
      dockerfile: .cnb/build/Dockerfile
      by:
        - .cnb/build/Dockerfile
    volumes:
      - gradle-cache:/home/gradle/gradle-cache:cow
  env:
    GRADLE_USER_HOME: /home/gradle/gradle-cache

# 发布：门禁过了才发，发的是代码里的 project.version。
.publish: &publish
  name: 发布到 maven registry
  script:
    - ./gradlew publish --configuration-cache

# 分支键写 "$" 兜底，任何分支的 push / PR 都过门禁。
$:
  push:
    verify:
      name: 主干门禁
      <<: *pipeline
      stages:
        - *verify

  # PR 门禁 = 格式/编译/单测 + 真打 .deb。
  # `.deb` 验收挂这里而不是 push：push 上任何分支都跑，会重复烧整份 runtime；
  # PR 是「合并前」这一次，跑一次就够，且验的正是 PR 自己的代码。
  pull_request:
    verify:
      name: PR 门禁
      <<: *pipeline
      stages:
        - *verify
        - *deb

  # 正式发布。
  web_trigger_release:
    - name: 发布 Release
      <<: *pipeline
      stages:
        - *verify
        - *publish

  # SNAPSHOT 发布：同版本号直接覆盖，覆盖策略由制品库负责。
  web_trigger_snapshot:
    - name: 发布 Snapshot
      <<: *pipeline
      stages:
        - *verify
        - *publish

  # 手动入口：工具链自检。
  web_trigger:
    - name: 工具链自检
      <<: *pipeline
      stages:
        - name: 打印版本
          script:
            - java -version
            - ./gradlew --version
